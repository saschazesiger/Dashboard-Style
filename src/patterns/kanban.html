<!doctype html>
<html lang="en" class="ds-theme ds-base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board · Product</title>
<meta name="pt-title" content="Kanban board">
<meta name="pt-need" content="Move work through columns by dragging a card or with the keyboard, with a limit on work in progress">
<meta name="pt-group" content="Work together">
<link rel="stylesheet" href="../../dist/fonts/fonts.css">
<link rel="stylesheet" href="ds/ds.kanban.css">
<link rel="stylesheet" href="../../dist/themes/presets/default.css" id="pt-theme">
<link rel="stylesheet" href="pt.css">
<script src="pt.js"></script>
<link rel="expect" href="#pt-ready" blocking="render">
</head>
<body>
<div class="ds-app ds-app--drawer" data-ds-shell="patterns">
  <a class="ds-skip" href="#main">Skip to content</a>

  <div class="ds-topbar">
    <button class="ds-btn ds-btn--quiet ds-btn--icon ds-topbar__menu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="drawer" data-icon="menu"></button>
    <a class="ds-brand" href="kanban.html"><span class="pt-brand__mark" data-icon="box"></span><span class="ds-brand__name">Product</span></a>
    <div class="ds-topbar__actions">
      <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-pressed="false" aria-label="Dark theme" data-tip="Dark theme" data-pt-scheme></button>
      <a class="ds-btn ds-btn--quiet ds-btn--icon" href="#help" aria-label="Help" data-tip="Help" data-icon="helpCircle"></a>
    </div>
    <div class="ds-account">
      <button class="ds-btn ds-btn--quiet ds-btn--icon ds-account__trigger" type="button" aria-label="Account: Ada Lovelace" aria-haspopup="menu" aria-expanded="false" aria-controls="account" data-ds-open="#account" data-tip="Ada Lovelace, ada@example.org"><span class="ds-account__avatar" aria-hidden="true">A</span></button>
      <div class="ds-menu ds-account__menu" role="menu" id="account" aria-labelledby="account-name account-email" hidden>
        <div class="ds-account__head" aria-hidden="true"><span class="ds-account__avatar ds-lg">A</span><div class="ds-account__name" id="account-name">Ada Lovelace</div><div class="ds-account__email" id="account-email">ada@example.org</div></div>
        <div class="ds-menu__divider" role="separator"></div>
        <a class="ds-menu__item" role="menuitem" href="#profile" data-icon="user" data-icon-place="start"><span class="ds-menu__label">Profile</span></a>
        <a class="ds-menu__item" role="menuitem" href="sign-in.html" data-icon="logout" data-icon-place="start"><span class="ds-menu__label">Sign out</span></a>
      </div>
    </div>
  </div>

  <div class="ds-scrim"></div>
  <nav class="ds-drawer" id="drawer" aria-label="Main" tabindex="-1">
    <div class="ds-drawer__head" aria-hidden="true"><span class="pt-brand__mark" data-icon="box"></span><span class="ds-brand__name">Product</span></div>
    <div class="ds-drawer__list">
      <div class="ds-drawer__group">
        <a class="ds-drawer__item" href="#overview" data-icon="overview" data-icon-place="start"><span class="ds-drawer__label">Overview</span></a>
        <a class="ds-drawer__item" href="#devices" data-icon="laptop" data-icon-place="start"><span class="ds-drawer__label">Devices</span></a>
        <a class="ds-drawer__item" href="#tickets" data-icon="ticket" data-icon-place="start"><span class="ds-drawer__label">Tickets</span></a>
      </div>
      <div class="ds-drawer__group">
        <p class="ds-drawer__heading">Work</p>
        <a class="ds-drawer__item" href="inbox.html" data-icon="inbox" data-icon-place="start"><span class="ds-drawer__label">Inbox</span></a>
        <a class="ds-drawer__item" href="chat.html" data-icon="chat" data-icon-place="start"><span class="ds-drawer__label">Chat</span></a>
        <a class="ds-drawer__item" href="files.html" data-icon="folder" data-icon-place="start"><span class="ds-drawer__label">Files</span></a>
        <a class="ds-drawer__item" href="calendar.html" data-icon="calendar" data-icon-place="start"><span class="ds-drawer__label">Calendar</span></a>
        <a class="ds-drawer__item" href="kanban.html" aria-current="page" data-icon="kanban" data-icon-place="start"><span class="ds-drawer__label">Board</span></a>
      </div>
      <div class="ds-drawer__group">
        <p class="ds-drawer__heading">Settings</p>
        <a class="ds-drawer__item" href="notification-settings.html" data-icon="bell" data-icon-place="start"><span class="ds-drawer__label">Notifications</span></a>
        <a class="ds-drawer__item" href="webhooks.html" data-icon="webhook" data-icon-place="start"><span class="ds-drawer__label">Webhooks</span></a>
        <a class="ds-drawer__item" href="billing.html" data-icon="creditCard" data-icon-place="start"><span class="ds-drawer__label">Billing</span></a>
      </div>
    </div>
  </nav>

  <div class="ds-panel">
    <main class="ds-view" id="main" tabindex="-1">
      <div class="ds-content">
        <div class="ds-page">
          <header class="ds-page-head">
            <div class="ds-page-head__row">
              <div class="ds-page-head__text">
                <h1 class="ds-page-head__title" tabindex="-1">Repairs board</h1>
                <p class="ds-page-head__lead">Drag a card by its handle, or focus the handle and use Space and the arrow keys.</p>
              </div>
              <div class="ds-page-head__actions">
                <button class="ds-btn ds-btn--filled" type="button" id="add" data-icon="plus" data-icon-size="18" data-icon-place="start">Add a card</button>
              </div>
            </div>
          </header>

          <div class="ds-scroll-x ds-scroll-x--reel" id="board" style="--ds-scroll-reel-item: min(85%, 18rem)"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ds-toasts" id="toasts"></div>

<template id="tags">
  <span class="ds-tag ds-tone-error" data-priority="high">High</span>
  <span class="ds-tag ds-tone-neutral" data-priority="normal">Normal</span>
</template>

<script src="ds/ds.kanban.js"></script>
<script>
(function () {
  'use strict';

  DS.icons.fill(document);
  DS.init(document);
  DS.ripple.attach(document);

  var esc = function (text) { return String(text).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var initials = function (name) { return name.split(' ').map(function (part) { return part[0].toUpperCase(); }).join('').slice(0, 2); };
  var toasts = document.getElementById('toasts');

  // ── The fake backend ──
  var columns = [
    { id: 'todo', name: 'To do', cards: [
      { id: 'c1', title: 'Replace the fan of LAPTOP-0042', ticket: 1051, owner: 'Alan Turing', priority: 'high' },
      { id: 'c2', title: 'Order a second dock for the lab', ticket: 1049, owner: 'Ada Lovelace', priority: 'normal' },
      { id: 'c3', title: 'Label the returned monitors', ticket: 1046, owner: 'Grace Hopper', priority: 'normal' },
    ] },
    { id: 'doing', name: 'In progress', limit: 3, cards: [
      { id: 'c4', title: 'Tablet screen crack', ticket: 1044, owner: 'Alan Turing', priority: 'high' },
      { id: 'c5', title: 'Set up four laptops for the new team', ticket: 1043, owner: 'Ada Lovelace', priority: 'normal' },
    ] },
    { id: 'review', name: 'Waiting', cards: [
      { id: 'c6', title: 'Warranty claim for the monitor stand', ticket: 1040, owner: 'Grace Hopper', priority: 'normal' },
    ] },
    { id: 'done', name: 'Done', cards: [
      { id: 'c7', title: 'Printer on floor 2 jams', ticket: 1042, owner: 'Alan Turing', priority: 'high' },
      { id: 'c8', title: 'Backup report for October', ticket: 1038, owner: 'Ada Lovelace', priority: 'normal' },
    ] },
  ];
  var tags = {};
  document.getElementById('tags').content.querySelectorAll('[data-priority]').forEach(function (tag) { tags[tag.getAttribute('data-priority')] = tag.outerHTML; });

  function cardHtml(card) {
    return '<div class="ds-card ds-density-compact" role="listitem" data-ds-key="' + card.id + '" aria-label="' + esc(card.title) + '">' +
      '<div class="ds-cluster ds-cluster--nowrap ds-cluster--top ds-cluster--between">' +
        '<h3>' + esc(card.title) + '</h3>' +
        '<button class="ds-btn ds-btn--quiet ds-btn--icon ds-sm ds-grip" type="button" aria-label="Move ' + esc(card.title) + '" data-icon="grip"></button>' +
      '</div>' +
      '<div class="ds-cluster ds-cluster--between">' +
        '<span class="ds-persona ds-persona--inline ds-sm"><span class="ds-avatar" aria-hidden="true">' + esc(initials(card.owner)) + '</span>' +
        '<span class="ds-persona__text"><span class="ds-persona__name">' + esc(card.owner) + '</span><span class="ds-persona__role">#' + card.ticket + '</span></span></span>' +
        tags[card.priority] +
      '</div>' +
      '</div>';
  }
  // A column's head: its name and its count, which turns to the warning tone and says "full" at its limit.
  function headHtml(column) {
    var full = column.limit && column.cards.length >= column.limit;
    return '<h2 class="ds-card__title" id="col-' + column.id + '">' + esc(column.name) + '</h2>' +
      '<span class="ds-badge' + (full ? ' ds-tone-warning' : ' ds-tone-neutral') + '">' +
      (column.limit ? column.cards.length + ' of ' + column.limit : column.cards.length) + (full ? '<span class="ds-sr">, full</span>' : '') + '</span>';
  }
  function renderHead(column) {
    DS.dom.morphHtml(board.querySelector('[data-zone="' + column.id + '"] [data-head]'), headHtml(column));
  }

  var board = document.getElementById('board');
  function render() {
    DS.dom.morphHtml(board, columns.map(function (column) {
      return '<section class="ds-card ds-card--filled" data-ds-key="' + column.id + '" data-zone="' + column.id + '" aria-labelledby="col-' + column.id + '">' +
        '<div class="ds-card__row" data-head>' + headHtml(column) + '</div>' +
        (column.limit ? '<p class="ds-meta">At most ' + column.limit + ' at a time.</p>' : '') +
        '<div class="ds-stack" role="list" aria-labelledby="col-' + column.id + '" data-list>' + column.cards.map(cardHtml).join('') + '</div>' +
        '</section>';
    }).join(''));
    DS.icons.fill(board);
  }
  render();

  function columnOf(zone) { return columns.find(function (column) { return column.id === zone.getAttribute('data-zone'); }); }

  // The engine: zones are the columns, the handle is the grip; a full column refuses what is not already in it.
  DS.dnd.create(board, {
    zones: '[data-zone]', list: '[data-list]', items: '[data-ds-key]',
    accept: function (item, zone) {
      var column = columnOf(zone);
      return !column.limit || column.cards.length < column.limit || item.closest('[data-zone]') === zone;
    },
    label: function (item) { return item.getAttribute('aria-label'); },
  });

  // The page saves on drop; the DOM is already in its new order, so only the data and the counts follow.
  board.addEventListener('ds:drop', function (event) {
    var detail = event.detail;
    var from = columnOf(detail.from.zone);
    var to = columnOf(detail.to.zone);
    var card = from.cards.splice(from.cards.findIndex(function (c) { return c.id === detail.item.getAttribute('data-ds-key'); }), 1)[0];
    to.cards.splice(detail.to.index, 0, card);
    renderHead(from);
    renderHead(to);
    if (to.id === 'done' && from.id !== 'done') DS.overlay.toast(toasts, 'Ticket #' + card.ticket + ' closed.', { kind: 'success' });
  });

  // A new card goes to the top of To do.
  var add = document.getElementById('add');
  add.addEventListener('click', function () {
    DS.overlay.prompt({ title: 'Add a card', label: 'What needs doing?', value: '', confirmLabel: 'Add card', opener: add }).then(function (title) {
      if (!title) return;
      columns[0].cards.unshift({ id: 'n' + Date.now(), title: title, ticket: 1052 + columns[0].cards.length, owner: 'Ada Lovelace', priority: 'normal' });
      var list = board.querySelector('[data-zone="todo"] [data-list]');
      DS.motion.flip(list, function (options) { DS.dom.morphHtml(list, columns[0].cards.map(cardHtml).join(''), options); }, { items: '[data-ds-key]' });
      DS.icons.fill(list);
      renderHead(columns[0]);
      DS.overlay.toast(toasts, 'Card added to To do.', { kind: 'success' });
    });
  });
}());
</script>
<div id="pt-ready" hidden></div>
</body>
</html>
