<!doctype html>
<html lang="en-GB" class="ds-theme ds-base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Product</title>
<meta name="pt-title" content="Not found (404)">
<meta name="pt-need" content="Say that an address leads nowhere and offer the way back">
<meta name="pt-group" content="Errors and status">
<link rel="stylesheet" href="../../dist/fonts/fonts.css">
<link rel="stylesheet" href="ds/ds.status.css">
<link rel="stylesheet" href="../../dist/themes/presets/default.css" id="pt-theme">
<link rel="stylesheet" href="pt.css">
<script src="pt.js"></script>
<link rel="expect" href="#pt-ready" blocking="render">
</head>
<body class="ds-cover ds-cover--screen">
<header>
  <a class="pt-brand" href="onboarding.html"><span class="pt-brand__mark" data-icon="box"></span>Product</a>
</header>
<main class="ds-result ds-result--not-found ds-cover__main" id="main" aria-labelledby="title">
  <span class="ds-result__disc" aria-hidden="true" data-icon="mapPin" data-icon-size="32"></span>
  <p class="ds-result__code">404</p>
  <h1 class="ds-result__title" id="title" tabindex="-1">Page not found</h1>
  <p class="ds-result__text">The address may be mistyped, or the page has moved. Start again from the overview.</p>
  <div class="ds-result__actions">
    <a class="ds-btn ds-btn--filled" href="onboarding.html">Go to the overview</a>
    <button class="ds-btn ds-btn--text" type="button" id="back">Go back</button>
  </div>
</main>
<footer class="pt-foot ds-cluster ds-cluster--center">
  <a class="ds-link--quiet" href="#help">Help</a>
  <a class="ds-link--quiet" href="#status">Service status</a>
  <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-pressed="false" aria-label="Dark theme" data-tip="Dark theme" data-pt-scheme></button>
</footer>

<script src="ds/ds.status.js"></script>
<script>
(function () {
  'use strict';

  DS.icons.fill(document);
  DS.init(document);
  DS.ripple.attach(document);

  // Back where the person came from; with no history (a link from outside) the button leads to the overview.
  document.getElementById('back').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.href = 'onboarding.html';
  });
}());
</script>
<div id="pt-ready" hidden></div>
</body>
</html>
