name: check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Rewrite the screenshots in the Playwright container and upload them (download and commit them by hand)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Every commit on main ships and needs its own result: one group per run there, because a shared group keeps
  # only one pending run and cancels the older one even with cancel-in-progress off.
  group: check-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # npm ci for lightningcss, the build's one dependency (D12); dist/ and its tools need nothing installed.
      - run: npm ci
      - run: npm run check
      - run: sh scripts/vendor.sh --from . "$RUNNER_TEMP/vendor" && sh scripts/vendor.sh --check "$RUNNER_TEMP/vendor"

  browser:
    needs: check
    runs-on: ubuntu-latest
    # 3.0 runs about 2,700 tests per engine, past 35 minutes in one job: each engine runs in four shards (--shard);
    # the shard that holds the Motion Lab spec takes the longest (WebKit about 30 minutes). The limit only catches a hang.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, fallback]
        shard: [1, 2, 3, 4]
        include:
          # perf: the paint budget and the style recalc times (perf.spec.js), alone in its job so no other test
          # shares the CPU; one shard.
          - browser: perf
            shard: 0
    # The official image of the pinned @playwright/test version (test/repo.test.js keeps the tag in step), so the
    # committed screenshots come from the same fonts and rasteriser on every run.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright test --config test/browser/playwright.config.js --project=${{ matrix.browser }} ${{ matrix.shard > 0 && format('--shard={0}/4', matrix.shard) || '' }} ${{ inputs.update-screenshots && '--update-snapshots' || '' }}
      # The job never commits: the engineer downloads the screenshots and commits them.
      - if: ${{ always() && inputs.update-screenshots }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: test/browser/__screenshots__/
          if-no-files-found: error
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
