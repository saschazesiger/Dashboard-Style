<!doctype html>
<html class="ds-theme ds-base" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devices</title>
  <link rel="stylesheet" href="vendor/dashboard-style/ds.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="ds-app">
    <main class="ds-view" id="main">
      <header class="ds-page-head">
        <h1 class="ds-page-head__title">Devices</h1>
        <div class="app-toolbar">
          <button class="ds-btn ds-sm" type="button" id="refresh">Refresh</button>
          <button class="ds-btn ds-btn--filled" type="button" data-open-dialog="add-device">Add device</button>
        </div>
      </header>

      <div class="ds-alert ds-tone-error" role="alert">
        <span class="ds-alert__text">Two devices did not report in the last hour.</span>
      </div>

      <section class="ds-card app-panel">
        <h2 class="ds-card__title">Fleet</h2>
        <div class="ds-card__section">
          <ul class="ds-kv-list">
            <li><div class="ds-kv-list__row"><span>Backup</span><strong><span class="ds-kv-list__icon ds-tone-success" aria-hidden="true"></span><span class="ds-sr">Passed:</span> Today, 02:00</strong></div></li>
            <li><div class="ds-kv-list__row"><span>Storage</span><strong><span class="ds-kv-list__icon ds-tone-warning" aria-hidden="true"></span><span class="ds-sr">Warning:</span> 82% used</strong></div></li>
          </ul>
          <div class="ds-meter ds-tone-warning" role="meter" aria-label="Storage" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100"><span class="ds-meter__fill" style="--ds-share: .82"></span></div>
        </div>
        <a class="ds-card__more" href="#all">All devices</a>
      </section>

      <div class="ds-table-wrap">
        <table class="ds-table ds-density-tight">
          <thead><tr><th scope="col">Device</th><th scope="col">Owner</th><th scope="col">Status</th></tr></thead>
          <tbody>
            <tr>
              <td>Gateway 12</td>
              <td><span class="ds-avatar ds-sm" aria-hidden="true">AL</span> Ada Lovelace</td>
              <td><span class="ds-status ds-tone-success">Online</span> <span class="ds-badge ds-tone-success">Updated</span></td>
            </tr>
            <tr>
              <td>Sensor 4</td>
              <td><span class="ds-avatar ds-sm" aria-hidden="true">AL</span> Ada Lovelace</td>
              <td><span class="ds-status ds-tone-warning">Late</span> <span class="ds-tag ds-tone-neutral">Lab</span></td>
            </tr>
          </tbody>
        </table>
      </div>

      <ul class="ds-legend">
        <li><span class="ds-legend__key ds-tone-neutral"></span> Idle</li>
        <li><span class="ds-legend__key ds-tone-error"></span> Offline</li>
      </ul>

      <p class="app-loading"><span class="ds-spinner ds-spinner--ink ds-sm" aria-hidden="true"></span> Loading devices</p>
      <div class="ds-loader ds-sm" role="status" aria-label="Loading"></div>
    </main>
  </div>

  <dialog class="ds-dialog ds-dialog--lg" id="add-device" aria-labelledby="add-device-title">
    <form class="ds-dialog__box" method="dialog">
      <header class="ds-dialog__head">
        <h2 class="ds-dialog__title" id="add-device-title">Add device</h2>
        <button class="ds-icon-btn" type="button" data-ds-close aria-label="Close"><svg aria-hidden="true"></svg></button>
      </header>
      <div class="ds-dialog__body">
        <label class="ds-label" for="disk">Disk</label>
        <div class="ds-input-group">
          <input class="ds-input" id="disk" inputmode="numeric">
          <span class="ds-input-group__suffix" aria-hidden="true">GB</span>
        </div>
        <label class="ds-check ds-sm"><input type="checkbox"> Notify the owner</label>
      </div>
      <footer class="ds-dialog__foot">
        <button class="ds-btn" type="button" data-ds-close>Cancel</button>
        <button class="ds-btn ds-btn--filled ds-sm" type="submit">Add</button>
      </footer>
    </form>
  </dialog>

  <div class="ds-toasts"></div>
  <script src="vendor/dashboard-style/ds.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
