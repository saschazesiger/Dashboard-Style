<!doctype html>
<html class="ds-theme ds-base" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets</title>
  <link rel="stylesheet" href="vendor/dashboard-style/ds.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="ds-view">
    <div class="ds-alert ds-alert--success" role="status"><span class="ds-alert__text">Ticket 1042 is closed.</span></div>
    <ul class="ds-list">
      <li class="ds-list__item">
        <span class="ds-badge ds-badge--warning">Waiting</span> Printer on floor 2 jams
      </li>
      <li class="ds-list__item">
        <span class="ds-badge ds-badge--error">Overdue</span> Product licence renewal
      </li>
      <li class="ds-list__item">
        <span class="ds-badge ds-badge--neutral">Draft</span> Replace the lobby display
      </li>
    </ul>
    <ol class="ds-columns__plot" aria-hidden="true">
      <li class="ds-columns__col ds-columns__col--warning"><span class="ds-columns__fill"></span></li>
      <li class="ds-columns__col ds-columns__col--error"><span class="ds-columns__fill"></span></li>
    </ol>
    <div class="ds-alert ds-alert--warning"><span class="ds-alert__text">Two tickets wait for a reply.</span></div>
    <span class="ds-avatar ds-avatar--lg" aria-hidden="true">AL</span>
    <div class="ds-meter ds-meter--error" role="meter" aria-label="Overdue share" aria-valuenow="12" aria-valuemin="0" aria-valuemax="100"><span class="ds-meter__fill" style="--ds-share: .12"></span></div>
    <span class="ds-kv-list__icon ds-kv-list__icon--error" aria-hidden="true"></span>
    <span class="ds-legend__key ds-legend__key--warning"></span>
  </main>
  <script type="module" src="js/charts.mjs"></script>
</body>
</html>
