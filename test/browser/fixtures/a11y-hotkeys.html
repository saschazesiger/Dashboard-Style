<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS.a11y and DS.hotkeys · fixture</title>
<link rel="stylesheet" href="/dist/fonts/fonts.css">
<link rel="stylesheet" href="/dist/ds.css">
<link rel="stylesheet" href="fixture.css">
</head>
<body>
<!-- The helpers of js/a11y.js and js/hotkeys.js in real engines, loaded as
     ES modules from src/js/: window.fx holds the modules. a11y.spec.js and
     hotkeys.spec.js. -->
<div class="ds-theme fx-root">
  <button class="ds-btn" type="button" id="before">Before</button>

  <section class="fx-section" id="region" aria-label="Trapped region">
    <button class="ds-btn" type="button" id="first">First</button>
    <button class="ds-btn" type="button" id="disabled" disabled>Disabled</button>
    <button class="ds-btn" type="button" id="unstopped" tabindex="-1">No stop</button>
    <button class="ds-btn" type="button" id="hidden" hidden>Hidden</button>
    <button class="ds-btn" type="button" id="unseen" style="visibility: hidden">Unseen</button>
    <label><input type="radio" name="kind" id="kind-a"> A</label>
    <label><input type="radio" name="kind" id="kind-b" checked> B</label>
    <input class="ds-input" id="field" aria-label="Field">
    <button class="ds-btn" type="button" id="open-dialog">Open dialog</button>
    <button class="ds-btn" type="button" id="last">Last</button>
  </section>

  <section class="fx-section" id="inner-region" aria-label="Second region">
    <button class="ds-btn" type="button" id="inner-first">Inner first</button>
    <button class="ds-btn" type="button" id="inner-last">Inner last</button>
  </section>

  <section class="fx-section" id="empty-region" aria-label="Nothing to focus"><p>Text only.</p></section>

  <button class="ds-btn" type="button" id="after">After</button>

  <ul id="people" role="listbox" aria-label="People">
    <li role="option" id="ada" tabindex="0">Ada Lovelace</li>
    <li role="option" id="alan" tabindex="-1" aria-disabled="true">Alan Turing</li>
    <li role="option" id="barbara" tabindex="-1">Barbara Liskov</li>
    <li role="option" id="grace" tabindex="-1">Grace Hopper</li>
    <li role="option" id="gone" tabindex="-1" hidden>Hedy Lamarr</li>
    <li role="option" id="named" tabindex="-1" aria-label="Katherine Johnson"><span aria-hidden="true">KJ</span></li>
  </ul>
  <div id="with-field" role="group" aria-label="With a field">
    <input class="ds-input" id="filter" aria-label="Filter">
    <button class="ds-btn" type="button" role="option" id="option-filter">Filter option</button>
  </div>

  <div id="hotkey-area">
    <button class="ds-btn" type="button" id="hk-button" data-ds-hotkey="mod+k x" data-ds-hotkey-description="Search devices" data-ds-hotkey-group="Devices">Search</button>
    <button class="ds-btn" type="button" id="hk-disabled" data-ds-hotkey="y" disabled>Disabled</button>
    <button class="ds-btn" type="button" id="hk-aria" data-ds-hotkey="u" aria-disabled="true">Blocked</button>
    <button class="ds-btn" type="button" id="hk-hidden" data-ds-hotkey="i" hidden>Hidden</button>
    <button class="ds-btn" type="button" id="hk-named" data-ds-hotkey="o" aria-keyshortcuts="O">Own name</button>
    <input class="ds-input" id="hk-field" type="search" aria-label="Search field" data-ds-hotkey="/" value="query">
    <input class="ds-input" id="plain-field" aria-label="Plain field">
    <input class="ds-input" id="readonly-field" aria-label="Read-only field" readonly value="fixed">
    <label><input type="checkbox" id="check"> Check</label>
    <select class="ds-select" id="choice" aria-label="Choice"><option>One</option></select>
    <div id="within-outer" tabindex="-1"><button class="ds-btn" type="button" id="within-inner">Inner</button></div>
  </div>

  <dialog class="ds-dialog" id="dialog" aria-labelledby="dialog-title">
    <div class="ds-dialog__box">
      <h2 class="ds-dialog__title" id="dialog-title">Dialog</h2>
      <button class="ds-btn" type="button" id="dialog-a" data-ds-hotkey="d">In dialog</button>
      <button class="ds-btn" type="button" id="dialog-b">Close</button>
    </div>
  </dialog>

  <div class="ds-toasts" id="toasts"></div>
</div>
<script type="module">
  import * as a11y from '/src/js/a11y.js';
  import * as hotkeys from '/src/js/hotkeys.js';
  import * as dom from '/src/js/dom.js';
  import * as overlay from '/src/js/overlay.js';
  import * as core from '/src/js/core.js';
  // The parts of DS.overlay that live in a component's folder, where they do (ds.js holds them all).
  for (const name of ['toast', 'dialog']) await import(`/src/components/${name}/${name}.js`).catch(() => null);
  window.fx = { a11y, hotkeys, dom, overlay, core, log: [] };
  core.init(document);
  document.getElementById('hk-button').addEventListener('click', () => window.fx.log.push('hk-button'));
  document.getElementById('hk-disabled').addEventListener('click', () => window.fx.log.push('hk-disabled'));
  document.getElementById('hk-aria').addEventListener('click', () => window.fx.log.push('hk-aria'));
  document.getElementById('hk-hidden').addEventListener('click', () => window.fx.log.push('hk-hidden'));
  document.getElementById('hk-named').addEventListener('click', () => window.fx.log.push('hk-named'));
  document.getElementById('dialog-a').addEventListener('click', () => window.fx.log.push('dialog-a'));
  document.getElementById('open-dialog').addEventListener('click', (event) => overlay.open(document.getElementById('dialog'), { opener: event.currentTarget }));
  document.getElementById('dialog-b').addEventListener('click', () => overlay.close(document.getElementById('dialog')));
  document.documentElement.setAttribute('data-fixture-ready', '');
</script>
</body>
</html>
