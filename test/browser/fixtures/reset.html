<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset · fixture</title>
<!-- A normalize-like reset without a layer, loaded before ds.css, as many
     projects do. From P1 on (ds.css in @layer ds.*), unlayered CSS wins:
     this page changes on purpose and documents the migration note. -->
<style>
button { font: inherit; border: 0; background: none; }
a { color: inherit; }
*, ::before, ::after { box-sizing: border-box; }
</style>
<link rel="stylesheet" href="/dist/fonts/fonts.css">
<link rel="stylesheet" href="/dist/ds.css">
<link rel="stylesheet" href="fixture.css">
</head>
<body>
<div class="ds-theme fx-root">
  <div class="fx-row" id="reset-buttons">
    <button class="ds-btn ds-btn--primary" type="button">Save</button>
    <button class="ds-btn ds-btn--tonal" type="button">Add entry</button>
    <button class="ds-btn" type="button">Export</button>
    <button class="ds-btn ds-btn--text" type="button">Details</button>
    <a class="ds-btn ds-btn--text" href="#history">History</a>
  </div>
  <div class="ds-field fx-narrow" id="reset-field"><label class="ds-field__label" for="reset-name">Name</label><input class="ds-input" id="reset-name" value="LAPTOP-0042"></div>
  <section class="ds-card fx-narrow" id="reset-card"><h2 class="ds-card__title">Sync</h2><p class="ds-muted">Runs every night at 02:00. <a href="#runs">Run history</a></p><button class="ds-btn ds-btn--sm" type="button">Run now</button></section>
</div>
<script src="/dist/ds.js"></script>
<script src="fixture.js"></script>
</body>
</html>
