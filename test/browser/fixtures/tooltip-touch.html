<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltips: when a tip shows, and touch · fixture</title>
<link rel="stylesheet" href="/dist/fonts/fonts.css">
<link rel="stylesheet" href="/dist/ds.css">
<link rel="stylesheet" href="fixture.css">
<style>
  .fx-col { width: 160px; }
  .fx-cut { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-table { width: 200px; table-layout: fixed; }
  .fx-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The .ds-sr declarations without the class, as a collapsed adaptive
     button or a rail's drawer label hide their text. */
  .fx-collapsed { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .fx-dot { display: inline-grid; place-items: center; width: 32px; height: 32px; }
</style>
</head>
<body>
<!-- DS.overlay.tooltips() and its 2.0 rule: a tip that repeats the visible
     text shows only while the text is cut off (a 160px column with a name
     that fits and one that does not, a td that clips an inline link), a tip
     that adds something always shows (a .ds-sr label, a label hidden as a
     1×1px box); touch: a tap on an image or a blocked control, a long press
     on the others, a link that keeps its own long press; a trigger that the
     page removes (test/browser/tooltip-touch.spec.js). -->
<div class="ds-theme fx-root" id="theme">
  <main id="page" tabindex="-1">
    <div class="fx-col">
      <a class="fx-cut" href="#a" id="fits" data-tip="LAPTOP-0042">LAPTOP-0042</a>
      <a class="fx-cut" href="#b" id="cut" data-tip="LAPTOP-0042-FINANCE-BACKUP-WEST">LAPTOP-0042-FINANCE-BACKUP-WEST</a>
    </div>
    <table class="ds-table fx-table">
      <tbody><tr><td class="fx-cell"><a href="#c" id="in-cell" data-tip="TABLET-0121-WAREHOUSE-NORTH-GATE">TABLET-0121-WAREHOUSE-NORTH-GATE</a></td></tr></tbody>
    </table>
    <p class="fx-row">
      <button class="ds-btn" type="button" id="adaptive" data-tip="Export"><span data-icon="download" data-size="20"></span><span class="fx-collapsed">Export</span></button>
      <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" id="sr-label" data-tip="Sync now"><span data-icon="sync" data-size="20"></span><span class="ds-sr">Sync now</span></button>
      <span class="fx-dot" role="img" aria-label="Online" data-tip="Online since 9:00" id="tap-img"><span data-icon="wifi" data-size="20"></span></span>
      <button class="ds-btn ds-btn--primary" type="button" aria-disabled="true" data-tip="Fill in the serial number first" id="tap-blocked">Publish</button>
      <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="Archive" data-tip="Archive" id="press-icon"><span data-icon="archive" data-size="20"></span></button>
      <a href="#report" data-tip="Opens the monthly report" id="press-link">Report</a>
      <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="Refresh" data-tip="Refresh the list" id="gone"><span data-icon="sync" data-size="20"></span></button>
    </p>
  </main>
</div>

<script src="/dist/ds.js"></script>
<script src="fixture.js"></script>
<script>
  (function () {
    window.clicks = [];
    document.addEventListener('click', function (event) {
      var trigger = event.target.closest('[data-tip]');
      if (trigger) window.clicks.push(trigger.id);
    });
    window.tips = DS.overlay.tooltips(document);
  }());
</script>
</body>
</html>
