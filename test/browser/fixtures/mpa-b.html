<!doctype html>
<html lang="en" class="ds-theme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page loads (b) · fixture</title>
<link rel="stylesheet" href="/dist/fonts/fonts.css">
<link rel="stylesheet" href="/dist/ds.css">
<link rel="stylesheet" href="fixture.css">
<link rel="stylesheet" href="/dist/css/optional/view-transitions.css" id="fx-optional">
<link rel="expect" href="#fx-rendered" blocking="render">
<script>
  // mpa-a.html and mpa-b.html: two pages of a multi-page app with the
  // opt-in stylesheet (css/optional/view-transitions.css) and a drawer
  // whose indicator is named `nav` by the classic scripts at the end of
  // <body>. The stylesheet is a parser-inserted link, so it blocks the
  // first render: Chromium does not wait for a script-inserted one and
  // then often reveals the new page without its @view-transition rule.
  // The first render also waits for the scripts (<link rel="expect"> on
  // the element after them): WebKit reveals a page while it still parses,
  // and a pill created later would miss the new snapshot. ?plain=1 turns
  // the stylesheet off (media "not all"): then no page load transitions.
  // The new page records what its View Transition animates at `ready`
  // (window.revealed).
  (function () {
    if (new URLSearchParams(location.search).get('plain') === '1') document.getElementById('fx-optional').media = 'not all';
    window.revealed = new Promise(function (resolve) {
      window.addEventListener('pagereveal', function (event) {
        var transition = event.viewTransition;
        if (!transition) { resolve({ transition: false, animations: [] }); return; }
        transition.ready.then(function () {
          var animations = document.documentElement.getAnimations({ subtree: true })
            .filter(function (a) { return /^::view-transition/.test(a.effect.pseudoElement || ''); })
            .map(function (a) { return { pseudo: a.effect.pseudoElement, name: a.animationName || '', duration: Number(a.effect.getComputedTiming().duration), delay: a.effect.getTiming().delay }; });
          resolve({ transition: true, animations: animations });
        }, function () { resolve({ transition: true, skipped: true, animations: [] }); });
      });
    });
  }());
</script>
</head>
<body>
<div class="ds-app ds-app--drawer">
  <div class="ds-topbar">
    <a class="ds-brand" href="mpa-a.html"><span class="ds-brand__name">Product</span></a>
  </div>
  <div class="ds-scrim"></div>
  <nav class="ds-drawer" aria-label="Main" tabindex="-1">
    <div class="ds-drawer__head" aria-hidden="true"><span class="ds-brand__name">Product</span></div>
    <div class="ds-drawer__list" data-indicator='[aria-current="page"]' data-indicator-class="ds-drawer__indicator" data-indicator-name="nav">
      <div class="ds-drawer__group">
        <a class="ds-drawer__item" id="to-a" href="mpa-a.html" data-fx-follow><span data-icon="overview" data-size="20"></span><span class="ds-drawer__label">Overview</span></a>
        <a class="ds-drawer__item" href="#devices" data-fx-follow><span data-icon="laptop" data-size="20"></span><span class="ds-drawer__label">Devices</span></a>
        <a class="ds-drawer__item" id="to-b" href="mpa-b.html" data-fx-follow aria-current="page"><span data-icon="ticket" data-size="20"></span><span class="ds-drawer__label">Tickets</span></a>
      </div>
    </div>
  </nav>
  <div class="ds-panel">
    <main class="ds-view" id="main" tabindex="-1">
      <div class="ds-content"><div class="ds-page">
        <header class="ds-page-head"><h1 class="ds-page-head__title" tabindex="-1">Tickets</h1></header>
        <section class="ds-card"><h2 class="ds-card__title">Tickets</h2><p class="ds-muted">Page b of a multi-page app.</p></section>
      </div></div>
    </main>
  </div>
</div>
<script src="/dist/ds.js"></script>
<script src="fixture.js"></script>
<script>
  // The links keep ?plain=1 (and ?speed=) of this page.
  Array.prototype.forEach.call(document.querySelectorAll('#to-a, #to-b'), function (link) {
    link.href = link.getAttribute('href').split('?')[0] + location.search;
  });
</script>
<div id="fx-rendered" hidden></div>
</body>
</html>
