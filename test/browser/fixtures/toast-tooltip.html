<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snackbars and tooltips · fixture</title>
<link rel="stylesheet" href="/dist/fonts/fonts.css">
<link rel="stylesheet" href="/dist/ds.css">
<link rel="stylesheet" href="fixture.css">
<style>
  .fx-tall { height: 1600px; }
  .fx-bottom { position: fixed; left: 24px; bottom: 8px; }
</style>
</head>
<body>
<!-- DS.overlay.toast() and DS.overlay.tooltips(): a region without role
     (announcers), one with the markup removed in 2.0 (role="status": toast()
     takes it off and adds the announcers), a toolbar of five
     tooltip icon buttons, a trigger whose tip equals its name, a trigger at
     the bottom edge (the tooltip flips above), a menu button with a tip,
     a native dialog with a trigger, and a div side sheet that the region
     follows. -->
<div class="ds-theme fx-root" id="theme">
  <main id="page" tabindex="-1">
    <p class="fx-row">
      <button class="ds-btn" type="button" id="before">Before the toolbar</button>
      <span class="fx-row" id="toolbar" role="toolbar" aria-label="Actions">
        <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="Copy link" data-tip="Copy link" id="tip-copy"><span data-icon="link" data-size="20"></span></button>
        <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="Download" data-tip="Download as CSV" id="tip-download"><span data-icon="download" data-size="20"></span></button>
        <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="Archive" data-tip="Archive" id="tip-archive"><span data-icon="archive" data-size="20"></span></button>
        <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="Settings" data-tip="Settings" id="tip-settings"><span data-icon="settings" data-size="20"></span></button>
        <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="More actions" data-tip="More actions" id="tip-more"><span data-icon="moreVertical" data-size="20"></span></button>
      </span>
      <button class="ds-btn" type="button" id="open-native">Open dialog</button>
      <button class="ds-btn" type="button" id="open-sheet">Details</button>
    </p>
    <p><button class="ds-btn" type="button" id="after">After the toolbar</button>
      <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="Sort by" data-tip="Sort by" id="tip-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="sort-menu"><span data-icon="sort" data-size="20"></span></button></p>
    <div class="ds-menu" role="menu" id="sort-menu" aria-label="Sort by" hidden>
      <button class="ds-menu__item" role="menuitem" type="button" id="sort-name"><span class="ds-menu__label">Name</span></button>
      <button class="ds-menu__item" role="menuitem" type="button"><span class="ds-menu__label">Last seen</span></button>
    </div>
    <div class="fx-tall"></div>
    <button class="ds-btn ds-btn--quiet ds-btn--icon fx-bottom" type="button" aria-label="Help" data-tip="Help for this page" id="tip-bottom"><span data-icon="info" data-size="20"></span></button>
  </main>

  <dialog class="ds-dialog" id="native" role="alertdialog" aria-labelledby="native-title">
    <div class="ds-dialog__backdrop" data-close></div>
    <div class="ds-dialog__box">
      <h2 class="ds-dialog__title" id="native-title">Delete 3 devices?</h2>
      <div class="ds-dialog__actions">
        <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="Info" data-tip="Deleted devices go to the archive" id="tip-dialog"><span data-icon="info" data-size="20"></span></button>
        <button class="ds-btn ds-btn--text" type="button" id="native-cancel" data-close autofocus>Cancel</button>
      </div>
    </div>
  </dialog>

  <div class="ds-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="ds-sheet__backdrop" data-close></div>
    <section class="ds-sheet__panel">
      <div class="ds-sheet__head">
        <h2 class="ds-sheet__title" id="sheet-title">LAPTOP-0042</h2>
        <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" id="sheet-close" aria-label="Close" data-close><span data-icon="close" data-size="20"></span></button>
      </div>
      <div class="ds-sheet__body" tabindex="0"><p>Synced nightly.</p></div>
    </section>
  </div>

  <div class="ds-toasts" id="toasts"></div>
  <div class="ds-toasts" id="old-markup" role="status" aria-live="polite" style="--ds-toast-bottom: 400px"></div>
</div>

<script src="/dist/ds.js"></script>
<script src="fixture.js"></script>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    $('open-native').addEventListener('click', function () { DS.overlay.open($('native'), { opener: this }); });
    $('open-sheet').addEventListener('click', function () { DS.overlay.open($('sheet'), { opener: this }); });
    $('tip-menu').addEventListener('click', function (event) {
      if (event.detail > 1) return;
      if (this.getAttribute('aria-expanded') === 'true') DS.overlay.close($('sort-menu'));
      else DS.overlay.open($('sort-menu'), { opener: this });
    });
    window.tips = DS.overlay.tooltips(document);
  }());
</script>
</body>
</html>
