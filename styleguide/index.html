<!doctype html>
<html lang="en" class="ds-theme ds-base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Styleguide · Z-Dash</title>
<!-- Works from disk (file://): plain links to dist/, classic scripts, the theme generator included. -->
<link rel="stylesheet" href="../dist/fonts/fonts.css">
<link rel="stylesheet" href="../dist/ds.min.css">
<!-- The theme preset (a light-dark() theme of dist/themes/presets/), on two links so a new one
     loads before the old one goes; the theme file on top of it (a shipped theme, two links for
     "system") or a snippet; then the theme generator's file while it is in use. -->
<link rel="stylesheet" id="sg-preset" href="../dist/themes/presets/default.css">
<link rel="stylesheet" id="sg-preset-2" disabled>
<link rel="stylesheet" id="sg-theme-file-1" disabled>
<link rel="stylesheet" id="sg-theme-file-2" disabled>
<style id="sg-theme-snippet"></style>
<style id="sg-generated"></style>
<script>
  // The stored preset and scheme before the first paint (shell.js keeps them in step, and applies a
  // stored theme file of its THEME_FILES once that has loaded).
  (function () {
    var t = {};
    try { t = JSON.parse(localStorage.getItem('ds-sg3-theme') || '{}') || {}; } catch (e) { t = {}; }
    var presets = ['default', 'slate', 'ocean', 'forest', 'violet', 'amber', 'rose', 'graphite'];
    if (presets.indexOf(t.preset) > 0 || t.contrast === true) {
      document.getElementById('sg-preset').setAttribute('href', '../dist/themes/presets/' + (presets.indexOf(t.preset) >= 0 ? t.preset : 'default') + (t.contrast === true ? '-contrast' : '') + '.css');
    }
    if (t.scheme === 'light' || t.scheme === 'dark') document.documentElement.setAttribute('data-ds-scheme', t.scheme);
  }());
</script>
<link rel="stylesheet" href="styleguide.css">
<link rel="stylesheet" href="shell.css">
<!-- Over http, the move to the Motion Lab and back is a cross-document View Transition and the
     drawer's pill glides across it; the first render waits for the scripts. -->
<link rel="stylesheet" href="../dist/css/optional/view-transitions.css">
<link rel="expect" href="#sg-rendered" blocking="render">
</head>
<body data-sg-page="v3">
<div class="ds-app ds-app--drawer" id="sg-app">
  <a class="ds-skip" href="#main">Skip to content</a>

  <div class="ds-topbar">
    <button class="ds-btn ds-btn--quiet ds-btn--icon ds-topbar__menu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sg-drawer" data-sg="menu"></button>
    <a class="ds-brand" href="#/"><span class="sg-mark" aria-hidden="true"></span><span class="ds-brand__name">Z-Dash</span></a>
    <span class="sg-version ds-meta" id="sg-version"></span>
    <div class="ds-topbar__search">
      <div class="ds-search"><span id="sg-search-icon" class="sg-icon-slot"></span><input class="ds-input" id="sg-search" type="search" aria-label="Search the styleguide" aria-keyshortcuts="/" placeholder="Search components, classes and tokens" autocomplete="off"><kbd class="ds-kbd ds-search__key" aria-hidden="true">/</kbd></div>
    </div>
    <div class="ds-topbar__actions sg-tools">
      <a class="ds-btn ds-btn--quiet ds-btn--icon sg-search-button" id="sg-search-button" href="#/search" aria-label="Search" data-tip="Search"></a>
      <span class="sg-speed-readout ds-meta" id="sg-speed-readout" hidden></span>
      <div class="sg-speed">
        <label class="ds-sr" for="sg-speed-select">Speed</label>
        <select class="ds-input ds-input--filled" id="sg-speed-select">
          <option value="1">1&times;</option>
          <option value="0.5">0.5&times;</option>
          <option value="0.25">0.25&times;</option>
          <option value="0.1">0.1&times;</option>
        </select>
      </div>
    </div>
  </div>

  <div class="ds-scrim"></div>
  <nav class="ds-drawer" id="sg-drawer" aria-label="Styleguide" tabindex="-1">
    <div class="ds-drawer__head" aria-hidden="true"><span class="sg-mark"></span><span class="ds-brand__name">Z-Dash</span></div>
    <div class="ds-drawer__list" id="sg-nav"></div>
  </nav>

  <div class="ds-panel">
    <main class="ds-view" id="main" tabindex="-1">
      <div class="ds-content"><div class="ds-page" id="sg-page"></div></div>
    </main>
  </div>
</div>

<div class="ds-toasts" id="sg-toasts"></div>

<script src="../dist/ds.min.js"></script>
<!-- The demo registry, the registry of the meta.json files and the demos (both generated), then the page. -->
<script src="sg-core.js"></script>
<script src="registry.js"></script>
<script src="demos.js"></script>
<script src="theme-generator.js"></script>
<script src="shell.js"></script>
<div id="sg-rendered" hidden></div>
</body>
</html>
